{% extends 'base.html' %}
{% block title %}Reset Email Sent — Sirius Yoga{% endblock %}
{% block content %}
<section class="section">
  <div class="form-card" style="text-align:center;">
    <div style="font-size:3rem;margin-bottom:1rem;">📬</div>
    <div class="form-title">Check Your Email</div>
    <p class="form-subtitle" style="margin-bottom:1.5rem;">
      We've sent a password reset link to your email address.<br>
      The link expires in <strong>24 hours</strong>.
    </p>
    <div style="background:var(--cream);border-radius:4px;padding:1rem;font-size:0.875rem;color:var(--soft-grey);margin-bottom:1.5rem;">
      💡 Don't see it? Check your <strong>spam/junk</strong> folder.
    </div>
    <a href="{% url 'login' %}" class="btn-primary" style="display:inline-block;">Back to Login</a>
  </div>
</section>
{% endblock %}
