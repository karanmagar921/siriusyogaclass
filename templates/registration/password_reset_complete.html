{% extends 'base.html' %}
{% block title %}Password Reset Complete — Sirius Yoga{% endblock %}
{% block content %}
<section class="section">
  <div class="form-card" style="text-align:center;">
    <div style="font-size:3rem;margin-bottom:1rem;">✅</div>
    <div class="form-title">Password Reset!</div>
    <p class="form-subtitle" style="margin-bottom:1.5rem;">

    </p>
    <a href="{% url 'login' %}" class="btn-primary" style="display:inline-block;">Login Now →</a>
  </div>
</section>
{% endblock %}
