{% extends 'base.html' %}
{% block title %}Forgot Password — Sirius Yoga{% endblock %}
{% block content %}
<section class="section">
  <div class="form-card">
    <div style="text-align:center;font-size:2.5rem;margin-bottom:1rem;">🔑</div>
    <div class="form-title">Forgot Password?</div>
    <p class="form-subtitle">Enter your email and we'll send you a reset link.</p>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-input" placeholder="your@email.com" required autofocus>
      </div>
      <button type="submit" class="btn-primary btn-full">Send Reset Link 📧</button>
    </form>
    <p style="text-align:center;margin-top:1.5rem;font-size:0.875rem;color:var(--soft-grey);">
      Remember it? <a href="{% url 'login' %}" style="color:var(--sage);">Back to Login</a>
    </p>
  </div>
</section>
{% endblock %}
